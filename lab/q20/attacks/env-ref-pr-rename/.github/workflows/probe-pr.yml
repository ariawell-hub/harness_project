# 공격 overlay env-ref-pr-rename: PR 쪽 정의로 environment 이름을 다른 기존 environment(recorder)로 바꾼다.
# 기대: recorder도 main 전용이라 여전히 막힌다.
name: probe-pr
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
env:
  PROBE_DEF: attack-env-ref-pr-rename
jobs:
  no-env:
    if: contains(github.head_ref, 'env-ref')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ENV_NAME: none
          S: ${{ secrets.Q20_FAKE_SECRET }}
        run: |
          if [ -n "$S" ]; then secret="set sha8=$(printf '%s' "$S" | sha256sum | cut -c1-8)"; else secret=empty; fi
          echo "Q20 env=$ENV_NAME event=$EVENT ref=$REF sha=$SHA def=$PROBE_DEF workflow_ref=$WORKFLOW_REF secret=$secret"
  env:
    if: contains(github.head_ref, 'env-ref')
    environment: recorder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ENV_NAME: recorder
          S: ${{ secrets.Q20_FAKE_SECRET }}
        run: |
          if [ -n "$S" ]; then secret="set sha8=$(printf '%s' "$S" | sha256sum | cut -c1-8)"; else secret=empty; fi
          echo "Q20 env=$ENV_NAME event=$EVENT ref=$REF sha=$SHA def=$PROBE_DEF workflow_ref=$WORKFLOW_REF secret=$secret"
