# 공격 overlay check-source-job-name: PR 쪽 정의(pull_request)의 job 이름을 필수 체크와 같은
# q20/recorded로 둔다. GitHub Actions 출처의 check run이 생긴다.
# 기대: 필수 체크의 출처가 시험 App으로 고정돼 있어 만족하지 못한다.
name: mimic-job
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  recorded:
    name: q20/recorded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Q20 mimic check run q20/recorded"
