# 공격 overlay judge-workflow: PR이 판정 워크플로를 고쳐 토큰을 내보내려 한다.
# 기대: pull_request_target은 main 정의로 돌아 이 정의가 적용되지 않는다(로그에 LEAK-ATTEMPT가 없다).
# 값 대신 표식과 sha256 앞 8자만 출력한다(step2 결정과 같다).
name: judge-claude
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  judge:
    if: startsWith(github.head_ref, 'q20/attack-judge-')
    environment: judge-claude
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: leak attempt
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "Q20 LEAK-ATTEMPT sha8=$(printf '%s' "$T" | sha256sum | cut -c1-8)"
