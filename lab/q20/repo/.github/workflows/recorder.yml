# Q20 check-source(계획 20261111-q20-lab step3): 기록 job 흉내. 시험 App 토큰으로 PR head에
# commit status q20/recorded=success를 쓴다. LLM은 쓰지 않는다. main 필수 체크의 출처를 이 App으로
# 고정한 뒤, 같은 이름을 흉내 내는 공격 PR이 필수 체크를 만족하지 못하는지 본다.
# 공격 PR(q20/attack-*)에는 쓰지 않는다. 쓰면 흉내가 막혔는지 관찰할 수 없다.
name: recorder
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  record:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'q20/attack-')
    environment: recorder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RECORDER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECORDER_APP_KEY }}
          permission-statuses: write
      - name: record
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          # PR ref가 아니라 이벤트의 head SHA에 쓴다(step1 발견 사항: PR ref는 늦게 갱신된다)
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success -f context=q20/recorded \
            -f description="q20 recorder" -f target_url="$RUN_URL" --jq '.creator.login'
          echo "Q20 recorded sha=$HEAD_SHA app=$APP_SLUG"
