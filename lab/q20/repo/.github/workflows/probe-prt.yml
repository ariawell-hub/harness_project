# Q20 env-ref(계획 20261111-q20-lab step2): pull_request_target이 어떤 ref·정의로 돌고,
# main 전용 environment의 비밀을 받는지 본다. 비밀은 비었는지와 sha256 앞 8자만 출력한다.
# head 브랜치 이름에 env-ref가 있는 PR에서만 돈다(다른 시험 step의 PR을 어지럽히지 않게).
name: probe-prt
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
env:
  PROBE_DEF: main-env-ref-v1
jobs:
  no-env:
    if: contains(github.head_ref, 'env-ref')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ENV_NAME: none
          S: ${{ secrets.Q20_FAKE_SECRET }}
        run: |
          if [ -n "$S" ]; then secret="set sha8=$(printf '%s' "$S" | sha256sum | cut -c1-8)"; else secret=empty; fi
          echo "Q20 env=$ENV_NAME event=$EVENT ref=$REF sha=$SHA base=$BASE_SHA head=$HEAD_SHA def=$PROBE_DEF workflow_ref=$WORKFLOW_REF workflow_sha=$WORKFLOW_SHA secret=$secret"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: checked-out
        run: |
          echo "Q20 checkout head=$(git rev-parse HEAD) def_in_tree=$(grep -m1 -o 'PROBE_DEF: .*' .github/workflows/probe-prt.yml)"
  env:
    if: contains(github.head_ref, 'env-ref')
    strategy:
      fail-fast: false
      matrix:
        env: [judge-claude, judge-codex, codex-auth-store, recorder]
    environment: ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ENV_NAME: ${{ matrix.env }}
          S: ${{ secrets.Q20_FAKE_SECRET }}
        run: |
          if [ -n "$S" ]; then secret="set sha8=$(printf '%s' "$S" | sha256sum | cut -c1-8)"; else secret=empty; fi
          echo "Q20 env=$ENV_NAME event=$EVENT ref=$REF sha=$SHA base=$BASE_SHA head=$HEAD_SHA def=$PROBE_DEF workflow_ref=$WORKFLOW_REF workflow_sha=$WORKFLOW_SHA secret=$secret"
