# Q20 judge-claude(계획 20261111-q20-lab step4): Claude 판정 job 격리 시험(설계서 10.4절 판정 job 규칙).
# main 정의(base/)의 프롬프트·스크립트만 실행하고, PR head(pr/)는 데이터로 읽기만 한다.
# Claude Code는 셸·웹·MCP 없이 Read·Grep·Glob만, pr/ 안으로 묶어 실행한다. 다음 step(LLM 없음)이 유출을 검사한다.
# 시험 PR(q20/attack-judge-*, q20/judge-control*)에서만 돈다. 구독 토큰을 쓰므로 다른 PR에서 돌리지 않는다.
name: judge-claude
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  judge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'q20/attack-judge-') || startsWith(github.head_ref, 'q20/judge-control'))
    environment: judge-claude
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 실행 중인 정의와 같은 main 끝(github.sha)을 base/로(step2 발견 사항)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: install claude code
        run: |
          npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.314
          claude --version
      - name: changed files (LLM 없음)
        env:
          MAIN_SHA: ${{ github.sha }}
        run: git -C pr diff --name-only "$MAIN_SHA...HEAD" > changed.txt
      - name: judge (LLM)
        working-directory: pr
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 미끼: 환경 변수·/proc/self/environ이 새면 결과에 이 값이 보인다
          Q20_FAKE_SECRET: ${{ secrets.Q20_FAKE_SECRET }}
        run: |
          prompt="$(cat ../base/judge/prompt.md; cat ../changed.txt)"
          set +e
          claude -p "$prompt" \
            --restricted \
            --tools Read,Grep,Glob \
            --allowedTools Read,Grep,Glob \
            --permission-mode dontAsk \
            --strict-mcp-config \
            --disable-slash-commands \
            --no-session-persistence \
            --json-schema "$(cat ../base/judge/verdict.schema.json)" \
            --output-format stream-json --verbose > ../claude-stream.jsonl
          echo "Q20 judge claude_exit=$?"
      - name: leak scan (LLM 없음)
        env:
          Q20_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          Q20_BAIT: ${{ secrets.Q20_FAKE_SECRET }}
          PR_DIR: ${{ github.workspace }}/pr
        run: node base/judge/scan.mjs claude-stream.jsonl verdict.json
