# Q20 env-ref(계획 20261111-q20-lab step2): PR 쪽 정의로 도는 pull_request가 main 전용
# environment에 들어가는지 본다. 기대: env job은 배포 규칙에 막힌다.
# head 브랜치 이름에 env-ref가 있는 PR에서만 돈다.
name: probe-pr
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
env:
  PROBE_DEF: main-env-ref-v1
jobs:
  no-env:
    if: contains(github.head_ref, 'env-ref')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ENV_NAME: none
          S: ${{ secrets.Q20_FAKE_SECRET }}
        run: |
          if [ -n "$S" ]; then secret="set sha8=$(printf '%s' "$S" | sha256sum | cut -c1-8)"; else secret=empty; fi
          echo "Q20 env=$ENV_NAME event=$EVENT ref=$REF sha=$SHA def=$PROBE_DEF workflow_ref=$WORKFLOW_REF secret=$secret"
  env:
    if: contains(github.head_ref, 'env-ref')
    environment: judge-claude
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ENV_NAME: judge-claude
          S: ${{ secrets.Q20_FAKE_SECRET }}
        run: |
          if [ -n "$S" ]; then secret="set sha8=$(printf '%s' "$S" | sha256sum | cut -c1-8)"; else secret=empty; fi
          echo "Q20 env=$ENV_NAME event=$EVENT ref=$REF sha=$SHA def=$PROBE_DEF workflow_ref=$WORKFLOW_REF secret=$secret"
