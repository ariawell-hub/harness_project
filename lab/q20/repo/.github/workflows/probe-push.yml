# Q20 env-ref(계획 20261111-q20-lab step2): main이 아닌 브랜치의 push(그 브랜치 정의로 돈다)가
# main 전용 environment에 들어가는지 본다. 기대: env job은 모두 배포 규칙에 막힌다.
# 브랜치 이름에 env-ref가 있을 때만 돈다(다른 시험 step의 push를 어지럽히지 않게).
name: probe-push
on:
  push:
    branches: ['q20/*env-ref*']
permissions:
  contents: read
env:
  PROBE_DEF: main-env-ref-v1
jobs:
  no-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ENV_NAME: none
          S: ${{ secrets.Q20_FAKE_SECRET }}
        run: |
          if [ -n "$S" ]; then secret="set sha8=$(printf '%s' "$S" | sha256sum | cut -c1-8)"; else secret=empty; fi
          echo "Q20 env=$ENV_NAME event=$EVENT ref=$REF sha=$SHA def=$PROBE_DEF workflow_ref=$WORKFLOW_REF secret=$secret"
  env:
    strategy:
      fail-fast: false
      matrix:
        env: [judge-claude, judge-codex, codex-auth-store, recorder]
    environment: ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ENV_NAME: ${{ matrix.env }}
          S: ${{ secrets.Q20_FAKE_SECRET }}
        run: |
          if [ -n "$S" ]; then secret="set sha8=$(printf '%s' "$S" | sha256sum | cut -c1-8)"; else secret=empty; fi
          echo "Q20 env=$ENV_NAME event=$EVENT ref=$REF sha=$SHA def=$PROBE_DEF workflow_ref=$WORKFLOW_REF secret=$secret"
