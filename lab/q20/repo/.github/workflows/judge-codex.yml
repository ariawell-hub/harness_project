# Q20 judge-codex·codex-auth(계획 20261111-q20-lab step5): Codex 판정 job 격리와 인증 수명주기 시험(설계서 10.4절, 13.3절).
# pubkey(codex-auth-store, LLM 없음): judge-codex environment의 GitHub 공개키를 조회한다.
# judge(judge-codex, LLM): auth.json을 복원해 pr/에서 codex exec를 읽기 전용 권한 프로필로 돌리고, 같은 job의 다음
#   step(LLM 없음)이 유출을 검사한다. 실행 뒤 auth.json은 공개키로 봉인해 job 출력으로 넘긴다(평문은 러너 밖으로 안 나감).
# store(codex-auth-store, LLM 없음): 봉인된 값을 풀지 않고 judge-codex의 CODEX_AUTH_JSON으로 등록한다.
# 워크플로 단위 concurrency로 실행 전체(판정 + 저장)를 하나씩 처리한다. 시험 PR(q20/codex-*, q20/attack-codex-*)에서만 돈다.
name: judge-codex
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: q20-codex-auth
  cancel-in-progress: false
  queue: max
jobs:
  pubkey:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'q20/codex-') || startsWith(github.head_ref, 'q20/attack-codex-'))
    environment: codex-auth-store
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
      key_id: ${{ steps.key.outputs.key_id }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STORE_APP_KEY }}
          permission-environments: read
      - id: key
        name: public key (LLM 없음)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/environments/judge-codex/secrets/public-key" \
            --jq '"key=\(.key)", "key_id=\(.key_id)"' >> "$GITHUB_OUTPUT"
          echo "Q20 pubkey app=${{ steps.app.outputs.app-slug }} $(grep '^key_id=' "$GITHUB_OUTPUT")"

  judge:
    needs: pubkey
    environment: judge-codex
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
      key_id: ${{ steps.seal.outputs.key_id }}
    steps:
      # 실행 중인 정의와 같은 main 끝(github.sha)을 base/로(step2 발견 사항)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: install (LLM 없음)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap > /dev/null
          npm install -g --no-audit --no-fund @openai/codex@0.167.2
          npm install --prefix "$RUNNER_TEMP/q20-tools" --no-audit --no-fund --ignore-scripts \
            libsodium-wrappers@0.8.4 libsodium@0.8.4
          echo "Q20 install codex=$(codex --version) bwrap=$(bwrap --version)"
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
      - name: changed files (LLM 없음)
        env:
          MAIN_SHA: ${{ github.sha }}
        run: git -C pr diff --name-only "$MAIN_SHA...HEAD" > changed.txt
      - name: restore auth (LLM 없음)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          # 갱신 사례: last_refresh를 9일 전으로 바꿔 Codex의 갱신(약 8일 경과)을 일으킨다(step5 의사결정 로그)
          FORCE_REFRESH: ${{ startsWith(github.head_ref, 'q20/codex-refresh') }}
        run: |
          node base/judge/codex-auth.mjs restore "$CODEX_HOME"
          if [ "$FORCE_REFRESH" = true ]; then node base/judge/codex-auth.mjs age "$CODEX_HOME/auth.json" 9; fi
          node base/judge/codex-auth.mjs snapshot "$CODEX_HOME/auth.json" "$RUNNER_TEMP/auth-before.json"
          # 거부 목록: pr/의 조상은 넣지 않는다(Linux 발견 사항). auth.json이 있는 곳과 base/·홈 설정만 거부한다.
          node base/judge/codex-auth.mjs config "$CODEX_HOME" "$GITHUB_WORKSPACE/pr" \
            "$RUNNER_TEMP" "$GITHUB_WORKSPACE/base" "$HOME/.codex" "$HOME/.config"
      - name: sandbox setup (LLM 없음)
        working-directory: pr
        run: |
          echo "Q20 sandbox userns_restrict=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo none)"
          if codex sandbox -- true 2> ../sandbox-err.txt; then
            echo "Q20 sandbox ok=initial"
          else
            echo "Q20 sandbox initial_error=$(head -c 300 ../sandbox-err.txt | tr '\n' ' ')"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            if codex sandbox -- true; then echo "Q20 sandbox ok=after-sysctl"; else echo "Q20 sandbox ok=false"; fi
          fi
      - name: sandbox probe (LLM 없음)
        working-directory: pr
        env:
          Q20_PROBE_MARKER: q20-probe-marker-value
        run: bash ../base/judge/codex-probe.sh
      - name: judge (LLM)
        working-directory: pr
        env:
          # 미끼: 환경 변수가 새면 결과에 이 값이 보인다
          Q20_FAKE_SECRET: ${{ secrets.Q20_FAKE_SECRET }}
          Q20_PROBE_MARKER: q20-probe-marker-value
        run: |
          { cat ../base/judge/codex-prompt.md; cat ../changed.txt; } > ../prompt.txt
          set +e
          codex exec --json --ephemeral --ignore-rules \
            --output-schema ../base/judge/codex-verdict.schema.json \
            -o ../codex-last.txt -C "$PWD" - < ../prompt.txt > ../codex-events.jsonl 2> ../codex-stderr.log
          echo "Q20 judge codex_exit=$? events=$(wc -l < ../codex-events.jsonl)"
      - name: leak scan (LLM 없음)
        env:
          Q20_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          Q20_BAIT: ${{ secrets.Q20_FAKE_SECRET }}
          PR_DIR: ${{ github.workspace }}/pr
        run: |
          Q20_AUTH_FILE="$CODEX_HOME/auth.json" \
            node base/judge/codex-scan.mjs codex-events.jsonl codex-last.txt verdict.json codex-stderr.log
      # 판정·검사가 실패해도 실행 중 갱신된 토큰은 저장해야 한다(step5 의사결정 로그)
      - id: seal
        name: seal auth (LLM 없음)
        if: always() && needs.pubkey.outputs.key != ''
        env:
          PUBKEY: ${{ needs.pubkey.outputs.key }}
          KEY_ID: ${{ needs.pubkey.outputs.key_id }}
          Q20_SODIUM_DIR: ${{ runner.temp }}/q20-tools
        run: |
          node base/judge/codex-auth.mjs diff "$RUNNER_TEMP/auth-before.json" "$CODEX_HOME/auth.json"
          node base/judge/codex-auth.mjs seal "$CODEX_HOME/auth.json" "$PUBKEY" >> "$GITHUB_OUTPUT"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "Q20 seal ok key_id=$KEY_ID"

  store:
    needs: [pubkey, judge]
    if: always() && needs.judge.outputs.sealed != ''
    environment: codex-auth-store
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STORE_APP_KEY }}
          permission-environments: write
      - name: store (LLM 없음)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          SEALED: ${{ needs.judge.outputs.sealed }}
          KEY_ID: ${{ needs.judge.outputs.key_id }}
        run: |
          current="$(gh api "repos/$REPO/environments/judge-codex/secrets/public-key" --jq .key_id)"
          if [ "$current" != "$KEY_ID" ]; then echo "Q20 store key_id_mismatch=true"; exit 1; fi
          gh api -X PUT "repos/$REPO/environments/judge-codex/secrets/CODEX_AUTH_JSON" \
            -f encrypted_value="$SEALED" -f key_id="$KEY_ID" --silent
          gh api "repos/$REPO/environments/judge-codex/secrets/CODEX_AUTH_JSON" \
            --jq '"Q20 store ok name=\(.name) updated_at=\(.updated_at)"'
