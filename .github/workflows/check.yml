# L3 필수 상태 체크 `check` (10.3절). PR 쪽 정의로 PR 코드를 실행하므로 비밀을 두지 않는다(10.4절).
# 캐시 옵션은 쓰지 않는다(10.4절 캐시 규칙). 액션은 커밋 SHA로 고정한다.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20'

      - name: pnpm
        run: corepack enable && pnpm --version

      - name: gitleaks (체크섬 검증)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: setup (비밀 없는 환경, 설치 스크립트 차단)
        run: node scripts/harness.ts setup

      - name: check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config user.email ci@users.noreply.github.com
          git config user.name ci
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # 첫 push 등 비교 대상이 없으면 첫 커밋부터 검사한다
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          else
            BASE=$(git merge-base "$BASE_SHA" HEAD)
          fi
          node scripts/harness.ts check --ci --base "$BASE"
