# L3 필수 상태 체크 `plan-gate` (R1, 10.3절).
# main의 정의(pull_request_target)로 돌고, base/의 스크립트만 실행한다. pr/는 데이터로 읽기만 한다(10.4절).
# 비밀을 쓰지 않으며 캐시를 복원하지 않는다. 포크에서 온 PR은 실행하지 않는다(체크가 없어 병합되지 않음).
name: plan-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  plan-gate:
    name: plan-gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: main 정의 체크아웃 (실행할 스크립트)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: PR head 체크아웃 (데이터로만 읽음)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20'

      - name: plan-gate (base 스크립트만 실행, 의존성 설치 없음)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cd pr
          BASE=$(git merge-base "$BASE_SHA" HEAD)
          node ../base/scripts/harness.ts plan-gate --repo . --config-root ../base --base "$BASE" --head-ref "$HEAD_REF"
