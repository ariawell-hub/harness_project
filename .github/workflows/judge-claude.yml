# L3 교차 검증: Claude 판정(10.1·10.4절, 계획 20261115-cross-review). `check`가 통과한 커밋에서만 돈다(R16).
# workflow_run은 main의 정의로 돌고, 판정할 PR은 페이로드가 아니라 head SHA로 API를 다시 조회해 정한다.
# plan:   비밀 없음. base/(github.sha)의 스크립트로 위험도와 필요한 검증자를 계산한다.
#         PR이 계획 폴더만 바꿨으면 mode=plan(계획 검증, G1)과 계획 해시를 낸다.
# judge:  judge-claude environment(Claude 구독 토큰만). base/의 프롬프트·스키마·스크립트만 실행하고 pr/는 데이터로 읽는다.
#         Claude Code는 셸·웹·MCP 없이 Read·Grep·Glob만 쓴다. 같은 job의 유출 검사(LLM 없음)를 통과해야 판정이 나간다.
#         실행 기록은 출력하지도 올리지도 않는다. GitHub 쓰기 권한·검증 App 키·Codex 인증은 없다.
# repro:  비밀·environment·쓰기 권한 없음. 검증자가 낸 재현 테스트를 PR head에 붙여 실행한다(PR 코드를 실행하는 유일한 job).
# record: recorder environment(검증 App 키만). PR 트리를 받지 않고 판정을 검사한 뒤 review/claude를 쓴다.
#         판정이 없거나 깨졌으면 error, 이 검증자가 필요 없으면 "해당 없음(통과)"이다.
#         이어서 지적 원장 댓글을 고치고 review-ledger를 쓴다(10.2절 (4)). PR마다 차례로 돈다.
# failed·ci-failure: check가 실패로 끝나면 failed(비밀 없음)가 PR을 정하고 ci-failure(recorder, LLM 없음)가 원장에 실패를 남긴다.
# PR 유래 값은 run 스크립트에 직접 넣지 않고 env로만 넘긴다. Actions 캐시는 복원하지 않는다. 액션은 커밋 SHA로 고정한다.
name: judge-claude

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions: {}

concurrency:
  group: judge-claude-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # 승인 이어받기: 앞선 head의 커밋 상태를 읽는다(10.3절)
      statuses: read
      # revert-check: 대상 커밋의 main check run을 읽는다(10.3절)
      checks: read
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      risk: ${{ steps.plan.outputs.risk }}
      claude: ${{ steps.plan.outputs.claude }}
      patch: ${{ steps.plan.outputs.patch }}
      carry: ${{ steps.plan.outputs.carry_claude }}
      number: ${{ steps.pr.outputs.number }}
      # 지적 원장(10.2절): 프롬프트 버전과 이 검증자의 직전 판정 이후 바뀐 파일
      prompt_base: ${{ steps.plan.outputs.prompt_base }}
      round_changed: ${{ steps.plan.outputs.round_changed }}
      ledger: ${{ steps.plan.outputs.ledger }}
      # 형식 검사를 통과한 작성자 반박(절차서 8절)
      rebuttals: ${{ steps.plan.outputs.rebuttals }}
      # 계획 검증(G1, 4.1절): PR이 계획 폴더만 바꿨으면 plan, 그 밖은 code. plan_hash는 계획 핵심 섹션 해시
      mode: ${{ steps.plan.outputs.mode }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
    steps:
      - name: main 정의 체크아웃 (실행할 스크립트, github.sha)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20'

      - name: 판정할 PR 정하기 (head SHA로 API 재조회)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: node base/scripts/harness.ts ci-pr --event "$GITHUB_EVENT_PATH" --body-out "$RUNNER_TEMP/pr-body.md"

      - name: PR 트리의 심볼릭 링크를 일반 파일로 받는다
        if: steps.pr.outputs.skip == 'false'
        run: git config --global core.symlinks false

      - name: PR head 체크아웃 (데이터로만 읽음)
        if: steps.pr.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: 위험도와 필요한 검증자 (base 스크립트만 실행)
        id: plan
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          cd pr
          BASE=$(git merge-base "$BASE_SHA" HEAD)
          node ../base/scripts/harness.ts review-plan --repo . --config-root ../base \
            --base "$BASE" --head-ref "$HEAD_REF" --pr-number "$PR_NUMBER" --base-sha "$BASE_SHA" \
            --reviewer claude

  judge:
    name: judge
    needs: plan
    if: needs.plan.outputs.skip == 'false' && needs.plan.outputs.claude == 'true' && needs.plan.outputs.carry == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: judge-claude
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.scan.outputs.verdict }}
      repro: ${{ steps.scan.outputs.repro }}
    steps:
      - name: main 정의 체크아웃 (프롬프트·스키마·스크립트, github.sha)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          # 프롬프트 버전 고정(10.2절 (2)): 원장에 적힌 1라운드 base SHA의 프롬프트를 읽는다
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20'

      - name: PR 트리의 심볼릭 링크를 일반 파일로 받는다
        run: git config --global core.symlinks false

      - name: PR head 체크아웃 (plan job이 정한 head, 데이터로만 읽음)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: 검증 입력 만들기 (pr/.harness-review/, job 사이에 pr/를 넘기지 않는다)
        env:
          HEAD_REF: ${{ needs.plan.outputs.head_ref }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          # plan job이 읽은 지적 원장(검증 App 봇 댓글의 자료). 판정 job은 GitHub 토큰 없이 이것으로 입력을 만든다
          LEDGER: ${{ needs.plan.outputs.ledger }}
          REBUTTALS: ${{ needs.plan.outputs.rebuttals }}
        run: |
          cd pr
          BASE=$(git merge-base "$BASE_SHA" HEAD)
          node ../base/scripts/harness.ts review-plan --repo . --config-root ../base \
            --base "$BASE" --head-ref "$HEAD_REF" --ledger "$LEDGER" --reviewer claude \
            --rebuttals "$REBUTTALS"

      - name: Claude Code 설치 (버전 고정)
        run: |
          npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.314
          claude --version

      - name: 프롬프트 (base의 것. 원장이 있으면 1라운드 base SHA의 버전, LLM 없음)
        env:
          PROMPT_BASE: ${{ needs.plan.outputs.prompt_base }}
          # 계획만 바꾼 PR이면 계획 검증 항목(prompt-plan.md)을 덧붙인다(G1)
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          node base/scripts/harness.ts review-prompt --base-dir base --files prompt.md \
            --prompt-base "$PROMPT_BASE" --mode "$MODE" --out "$RUNNER_TEMP/prompt.md"

      - name: 판정 (LLM. 셸·웹·MCP 없음, PR 트리의 설정 무시)
        working-directory: pr
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          timeout 20m claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --restricted \
            --tools Read,Grep,Glob \
            --allowedTools Read,Grep,Glob \
            --permission-mode dontAsk \
            --strict-mcp-config \
            --disable-slash-commands \
            --no-session-persistence \
            --json-schema "$(cat ../base/scripts/cross-review/verdict.schema.json)" \
            --output-format stream-json --verbose > "$RUNNER_TEMP/claude-stream.jsonl"
          echo "judge-claude: claude 종료 코드 $?"

      - name: 유출 검사 (LLM 없음. 통과해야 판정이 나간다)
        id: scan
        env:
          SCAN_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/verdict.json"
          node base/scripts/harness.ts claude-scan --log "$RUNNER_TEMP/claude-stream.jsonl" \
            --pr "$GITHUB_WORKSPACE/pr" --out "$OUT"
          echo "verdict=$(base64 -w0 "$OUT")" >> "$GITHUB_OUTPUT"

  repro:
    name: repro
    needs: [plan, judge]
    # 재현 테스트가 붙은 지적이 있을 때만 돈다. judge의 유출 검사 단계가 repro 출력으로 정하고, 값이 없으면 돈다(Issue #143)
    if: needs.judge.outputs.verdict != '' && needs.judge.outputs.repro != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR 코드를 실행한다: 비밀·environment·쓰기 권한이 없다(10.4절). 결과는 조작될 수 있는 값으로 다룬다
    permissions:
      contents: read
    outputs:
      results: ${{ steps.run.outputs.results }}
    steps:
      - name: main 정의 체크아웃 (재현 스크립트와 설정만)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          sparse-checkout: |
            scripts
            harness.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20'

      - name: PR head 체크아웃 (재현 테스트를 붙여 실행할 트리)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: pr
          persist-credentials: false

      - name: 재현 테스트 실행 (base의 설정과 스크립트로, 테스트마다 시간 제한)
        id: run
        env:
          VERDICT_B64: ${{ needs.judge.outputs.verdict }}
        run: |
          F="$RUNNER_TEMP/verdict.json"
          printf '%s' "$VERDICT_B64" | base64 -d > "$F"
          node base/scripts/harness.ts repro --verdict "$F" --repo pr --config-root base

  record:
    name: record
    needs: [plan, judge, repro]
    if: ${{ !cancelled() && needs.plan.result != 'skipped' && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: recorder
    # 두 판정 워크플로의 기록 job이 원장 댓글 하나를 읽고-고치고-쓴다. PR마다 하나씩 차례로 돈다
    concurrency:
      group: ledger-${{ needs.plan.outputs.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - name: main 정의 체크아웃 (기록 스크립트와 설정만)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          sparse-checkout: |
            scripts
            harness.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20'

      - name: 검증 App 토큰 (커밋 상태 쓰기만)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RECORDER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECORDER_APP_KEY }}
          permission-statuses: write

      # 원장 댓글용 토큰은 따로 받는다. 검증 App에 Pull requests 쓰기 권한이 없으면 이 단계만 실패하고
      # review/* 기록은 그대로 된다(review-ledger는 error로 남는다)
      - name: 검증 App 토큰 (지적 원장 댓글 읽기·쓰기)
        id: ledger
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RECORDER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECORDER_APP_KEY }}
          permission-pull-requests: write

      - name: record-review (판정 검사 뒤 review/claude와 지적 원장·review-ledger 기록)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERDICT_B64: ${{ needs.judge.outputs.verdict }}
          # plan job이 계산하지 못했으면 필요한 것으로 보고 error를 남긴다(fail-closed)
          NEEDED: ${{ needs.plan.outputs.claude }}
          # plan job이 PR을 정하기 전에 죽었으면 check가 돈 head에 error를 남긴다
          HEAD_SHA: ${{ needs.plan.outputs.head_sha || github.event.workflow_run.head_sha }}
          # 승인 결속(10.3절): 승인에 적을 patch와, 이어받을 원래 head(있으면 판정 없이 success)
          PATCH: ${{ needs.plan.outputs.patch }}
          CARRIED: ${{ needs.plan.outputs.carry }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 지적 원장(10.2절 (4)): 댓글 토큰, PR 번호, 새 원장에 적을 프롬프트 버전, 직전 판정 이후 바뀐 파일
          LEDGER_TOKEN: ${{ steps.ledger.outputs.token }}
          PR_NUMBER: ${{ needs.plan.outputs.number }}
          PROMPT_BASE: ${{ github.sha }}
          ROUND_CHANGED: ${{ needs.plan.outputs.round_changed }}
          # 재현 job 결과(PR 코드가 만든 값. 순번과 값만 받는다)
          REPRO: ${{ needs.repro.outputs.results }}
          # 계획 검증(G1): plan job이 계산한 값. 계획 전용 head에서 review/*가 success면 원장에 계획 승인을 남긴다
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN_HASH: ${{ needs.plan.outputs.plan_hash }}
        run: |
          [ "$NEEDED" = "false" ] || NEEDED=true
          F="$RUNNER_TEMP/verdict.json"
          printf '%s' "$VERDICT_B64" | base64 -d > "$F" 2>/dev/null || : > "$F"
          node base/scripts/harness.ts record-review --context review/claude --needed "$NEEDED" \
            --verdict "$F" --head-sha "$HEAD_SHA" --repo-slug "$REPO" --target-url "$RUN_URL" \
            --patch "$PATCH" --carried-from "$CARRIED" \
            --config-root base --pr-number "$PR_NUMBER" --prompt-base "$PROMPT_BASE" \
            --round-changed "$ROUND_CHANGED" --repro-results "$REPRO" \
            --mode "$MODE" --plan-hash "$PLAN_HASH"

  failed:
    name: failed
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: main 정의 체크아웃 (실행할 스크립트, github.sha)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20'

      - name: 실패한 PR 정하기 (head SHA로 API 재조회)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: node base/scripts/harness.ts ci-pr --event "$GITHUB_EVENT_PATH" --body-out "$RUNNER_TEMP/pr-body.md"

  ci-failure:
    name: ci-failure
    needs: failed
    if: needs.failed.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: recorder
    # 원장 댓글을 고치므로 기록 job과 같은 그룹에서 차례로 돈다
    concurrency:
      group: ledger-${{ needs.failed.outputs.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - name: main 정의 체크아웃 (기록 스크립트와 설정만)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          sparse-checkout: |
            scripts
            harness.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20'

      - name: 검증 App 토큰 (지적 원장 댓글 읽기·쓰기)
        id: ledger
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RECORDER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECORDER_APP_KEY }}
          permission-pull-requests: write

      - name: 원장에 check 실패 기록
        env:
          LEDGER_TOKEN: ${{ steps.ledger.outputs.token }}
          PR_NUMBER: ${{ needs.failed.outputs.number }}
          HEAD_SHA: ${{ needs.failed.outputs.head_sha }}
          REPO: ${{ github.repository }}
          PROMPT_BASE: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          node base/scripts/harness.ts ledger-ci-failure --config-root base --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" --repo-slug "$REPO" --run-url "$RUN_URL" --prompt-base "$PROMPT_BASE"
